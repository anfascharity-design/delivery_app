name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Build App with Connectivity and Logo
        run: |
          flutter create . --org com.tair.alzagel --project-name tair_alzagel --platforms=android
          mkdir -p assets
          
          # جلب اللوجو إن وجد
          if [ -f logo.png ]; then
            cp logo.png assets/logo.png
          elif [ -f logo.jpg ]; then
            cp logo.jpg assets/logo.png
          fi

          # إضافة حزمة فحص الإنترنت بشكل نظيف وآمن لملف pubspec.yaml
          python3 -c '
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()
          if "connectivity_plus" not in content:
              content = content.replace("dependencies:", "dependencies:\n  connectivity_plus: ^6.0.5")
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          '

          # تعديل اسم التطبيق وصلاحيات الإنترنت وحالة الشبكة في أندرويد
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:label=".*"/android:label="طير الزاجل"/g' "$MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST_PATH"
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
