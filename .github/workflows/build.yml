name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
      - name: Setup project, configure icon, internet & dependencies, and build
        run: |
          flutter create . --org com.tair.alzagel --project-name tair_alzagel --platforms=android
          mkdir -p lib assets
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi
          
          # نقل اللوجو إن وجد
          if ls logo.* 1> /dev/null 2>&1; then
            cp logo.* assets/logo.png
          elif ls *.png 1> /dev/null 2>&1; then
            cp *.png assets/logo.png
          fi
          
          # إضافة الحزم وإعدادات الأيقونة في pubspec.yaml بطريقة نظيفة
          python3 -c '
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()
          
          # إضافة مكتبات الاتصال والأيقونات إذا لم تكن موجودة
          if "connectivity_plus" not in content:
              content = content.replace("dependencies:", "dependencies:\n  connectivity_plus: ^6.0.5")
          
          if "flutter_launcher_icons" not in content:
              content += "\nflutter_launcher_icons:\n  image_path: \"assets/logo.png\"\n  android: true\n  ios: true\n  min_sdk_android: 21\n"
          
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          '
          
          flutter pub get
          if [ -f assets/logo.png ]; then
            flutter pub run flutter_launcher_icons
          fi
          
          # تعديل اسم التطبيق وإضافة صلاحية الإنترنت في أندرويد
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:label=".*"/android:label="طير الزاجل"/g' "$MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST_PATH"
          fi
          
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
